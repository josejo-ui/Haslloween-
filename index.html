<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuestro Haslloween 2025 🎃</title>
    <style>
        body {
            margin: 0;
            height: 100vh; /* Para que el contenedor de animación cubra toda la altura */
            background: #1a1a1a; /* Fondo oscuro de Halloween */
            font-family: Arial, sans-serif;
            color: #ff9900; /* Texto naranja */
            padding: 40px 20px;
            text-align: center;
            overflow: hidden; /* Oculta barras de desplazamiento */
            position: relative; /* Necesario para el z-index */
        }

        h1 {
            color: #ff4500; /* Naranja más intenso */
            margin-bottom: 30px;
            font-size: 3em;
            text-shadow: 2px 2px 5px #000;
            position: relative; /* Asegura que el título esté por encima de las animaciones */
            z-index: 2;
        }
        
        /* Estilo para el reproductor de audio, asegurando que se vea bien */
        #audio-player {
            margin-bottom: 30px;
            position: relative;
            z-index: 2; /* Para que esté sobre las animaciones */
        }
        /* Fin del estilo de audio */

        #gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative; /* Asegura que la galería esté por encima de las animaciones */
            z-index: 2;
        }

        .photo-card {
            width: 300px;
            height: 250px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.7);
            position: relative;
            background-color: #333;
            transition: transform 0.3s ease;
        }

        .photo-card:hover {
            transform: scale(1.05);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-card:hover img {
            transform: scale(1.2); 
        }

        .photo-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 0;
            font-size: 1.1em;
            font-weight: bold;
        }

        /* --- Contenedor para las animaciones flotantes --- */
        #animation-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Permite hacer clic a través de él */
            z-index: 1; /* Detrás del título y la galería */
            overflow: hidden; /* Para que los elementos no generen scroll */
        }

        .floating-element {
            position: absolute;
            animation: moveAndFade 10s linear forwards; /* Duración de la animación */
            pointer-events: none;
            opacity: 0.8; /* Opacidad base para todos los elementos flotantes */
        }

        /* Estilos específicos para las fotos flotantes */
        .floating-photo {
            width: 100px; /* Tamaño de las fotos flotantes */
            height: auto;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            opacity: 0.7; /* Ligeramente más translúcidas */
        }

        /* Estilos específicos para los emojis de Halloween */
        .floating-halloween-emoji {
            font-size: 2.5em; /* Tamaño de los emojis */
        }
    </style>
</head>
<body>
    <h1>Nuestro Haslloween 2025 🎃</h1>

    <div id="audio-player">
        <audio controls autoplay loop muted>
            <source src="audio Haslloween.mp3" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </div>
    <div id="gallery">
        </div>

    <div id="animation-container">
        </div>
</body>
</html>
