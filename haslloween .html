<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuestro Haslloween 2025 🎃</title>
    <style>
        body {
            margin: 0;
            height: 100vh; /* Para que el contenedor de animación cubra toda la altura */
            background: #1a1a1a; /* Fondo oscuro de Halloween */
            font-family: Arial, sans-serif;
            color: #ff9900; /* Texto naranja */
            padding: 40px 20px;
            text-align: center;
            overflow: hidden; /* Oculta barras de desplazamiento */
            position: relative; /* Necesario para el z-index */
        }

        h1 {
            color: #ff4500; /* Naranja más intenso */
            margin-bottom: 30px;
            font-size: 3em;
            text-shadow: 2px 2px 5px #000;
            position: relative; /* Asegura que el título esté por encima de las animaciones */
            z-index: 2;
        }

        #gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative; /* Asegura que la galería esté por encima de las animaciones */
            z-index: 2;
        }

        .photo-card {
            width: 300px;
            height: 250px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.7);
            position: relative;
            background-color: #333;
            transition: transform 0.3s ease;
        }

        .photo-card:hover {
            transform: scale(1.05);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-card:hover img {
            transform: scale(1.2); 
        }

        .photo-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 0;
            font-size: 1.1em;
            font-weight: bold;
        }

        /* --- Contenedor para las animaciones flotantes --- */
        #animation-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* Permite hacer clic a través de él */
            z-index: 1; /* Detrás del título y la galería */
            overflow: hidden; /* Para que los elementos no generen scroll */
        }

        .floating-element {
            position: absolute;
            animation: moveAndFade 10s linear forwards; /* Duración de la animación */
            pointer-events: none;
            opacity: 0.8; /* Opacidad base para todos los elementos flotantes */
        }

        /* Estilos específicos para las fotos flotantes */
        .floating-photo {
            width: 100px; /* Tamaño de las fotos flotantes */
            height: auto;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            opacity: 0.7; /* Ligeramente más translúcidas */
        }

        /* Estilos específicos para los emojis de Halloween */
        .floating-halloween-emoji {
            font-size: 2.5em; /* Tamaño de los emojis */
        }

        /* Estilos específicos para los corazones con opacidad */
        .floating-heart {
            font-size: 2em; /* Tamaño de los corazones */
            opacity: 0.5; /* 50% de opacidad */
        }

        @keyframes moveAndFade {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(var(--final-x), var(--final-y)) scale(0.6); /* Se encogen un poco */
                opacity: 0; /* Desaparecen al final */
            }
        }
    </style>
</head>
<body>

    <h1>🎃 Nuestro Halloween 2025 👻</h1>

    <div id="gallery">
        <div class="photo-card">
            <img src="12-IMG_1033.jpg" alt="Fantasmas de Halloween">
            <div class="photo-caption">Fantasmas Jugando</div>
        </div>
        
        <div class="photo-card">
            <img src="11-IMG_1030.jpg" alt="Calabaza en el suelo">
            <div class="photo-caption">La Calabaza Tumbada</div>
        </div>

        <div class="photo-card">
            <img src="10-IMG_1027.jpg" alt="Persona con máscara">
            <div class="photo-caption">La Máscara de José</div>
        </div>

        <div class="photo-card">
            <img src="9-IMG_1025.jpg" alt="Calabaza escondida">
            <div class="photo-caption">Calabaza Sorpresa</div>
        </div>

        <div class="photo-card">
            <img src="8-IMG_1021.jpg" alt="Niño con calabaza pequeña">
            <div class="photo-caption">El Pequeño Guardián</div>
        </div>

        <div class="photo-card">
            <img src="7-IMG_1020.jpg" alt="Calavera y calabaza">
            <div class="photo-caption">Dúo Terrorífico</div>
        </div>
        
        <div class="photo-card">
            <img src="6-IMG_1017.jpg" alt="Pareja en el bosque">
            <div class="photo-caption">En el Bosque Embrujado</div>
        </div>

        <div class="photo-card">
            <img src="5-IMG_1015.jpg" alt="Pareja mirando">
            <div class="photo-caption">Miradas Cómplices</div>
        </div>

        <div class="photo-card">
            <img src="4-IMG_1012.jpg" alt="Pareja sentada en el pasto">
            <div class="photo-caption">Descanso Zombi</div>
        </div>
        
        <div class="photo-card">
            <img src="3-IMG_1011.jpg" alt="Pareja agarrados de la mano">
            <div class="photo-caption">Paseo Nocturno</div>
        </div>
    </div>
    
    <div id="animation-container"></div> <script>
        const animationContainer = document.getElementById('animation-container');
        
        // Nombres de tus fotos de Halloween para las animaciones
        const floatingPhotos = [
            '12-IMG_1033.jpg',
            '11-IMG_1030.jpg',
            '10-IMG_1027.jpg',
            '9-IMG_1025.jpg',
            '8-IMG_1021.jpg',
            '7-IMG_1020.jpg',
            '6-IMG_1017.jpg',
            '5-IMG_1015.jpg',
            '4-IMG_1012.jpg',
            '3-IMG_1011.jpg',
        ];

        // Emojis de Halloween
        const halloweenEmojis = ['👻', '🎃', '🕸️', '🕷️', '🦇', '🌕', '🕯️'];

        // Corazones naranjas y morados
        const coloredHearts = ['🧡', '💜'];

        // Función general para crear elementos flotantes
        function createFloatingElement(type) {
            const element = (type === 'photo') ? document.createElement('img') : document.createElement('span');
            element.classList.add('floating-element');
            
            let content;
            if (type === 'photo') {
                content = floatingPhotos[Math.floor(Math.random() * floatingPhotos.length)];
                element.src = content;
                element.classList.add('floating-photo');
            } else if (type === 'halloweenEmoji') {
                content = halloweenEmojis[Math.floor(Math.random() * halloweenEmojis.length)];
                element.innerHTML = content;
                element.classList.add('floating-halloween-emoji');
            } else if (type === 'coloredHeart') {
                content = coloredHearts[Math.floor(Math.random() * coloredHearts.length)];
                element.innerHTML = content;
                element.classList.add('floating-heart');
            }

            // Posición de inicio aleatoria desde los bordes
            const side = Math.floor(Math.random() * 4); // 0: top, 1: right, 2: bottom, 3: left
            let startX, startY;

            if (side === 0) { // Desde arriba
                startX = Math.random() * window.innerWidth;
                startY = -100;
            } else if (side === 1) { // Desde la derecha
                startX = window.innerWidth + 100;
                startY = Math.random() * window.innerHeight;
            } else if (side === 2) { // Desde abajo
                startX = Math.random() * window.innerWidth;
                startY = window.innerHeight + 100;
            } else { // Desde la izquierda
                startX = -100;
                startY = Math.random() * window.innerHeight;
            }

            element.style.left = `${startX}px`;
            element.style.top = `${startY}px`;
            
            // Posición final aleatoria en cualquier parte de la pantalla
            const finalX = Math.random() * window.innerWidth;
            const finalY = Math.random() * window.innerHeight;

            element.style.setProperty('--final-x', `${finalX - startX}px`);
            element.style.setProperty('--final-y', `${finalY - startY}px`);

            animationContainer.appendChild(element);

            setTimeout(() => {
                element.remove();
            }, 10000); // Duración total de la animación
        }

        // Intervalos para crear los diferentes tipos de elementos flotantes
        setInterval(() => createFloatingElement('photo'), 1500); // Fotos cada 1.5 segundos
        setInterval(() => createFloatingElement('halloweenEmoji'), 500); // Emojis de Halloween cada 0.5 segundos
        setInterval(() => createFloatingElement('coloredHeart'), 300); // Corazones cada 0.3 segundos

    </script>
</body>
</html>
